<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' data: https: http:;">
    <title>essay Detail</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
    <script src="translations.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
    <style>
        .essay-detail {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            color: var(--secondary-text);
            text-decoration: none;
            margin-bottom: 3rem;
            font-weight: 400;
            padding: 0.5rem 0;
            border-bottom: 1px solid transparent;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85rem;
        }

        .back-link:hover {
            color: var(--text-color);
            border-bottom-color: var(--text-color);
            text-decoration: none;
        }

        .essay-header {
            text-align: center;
            margin-bottom: 4rem;
            padding: 4rem 2rem;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 8px;
            overflow: hidden;
        }

        .essay-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .essay-header > * {
            position: relative;
            z-index: 2;
        }

        .essay-header.has-image {
            color: white;
        }

        .essay-header.has-image .essay-author,
        .essay-header.has-image .essay-date {
            color: rgba(255, 255, 255, 0.8);
        }

        .essay-header.has-image h1 {
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Default header without image */
        .essay-header:not(.has-image) {
            background: var(--hover-bg);
            padding: 2rem 0;
        }

        .essay-header:not(.has-image)::before {
            display: none;
        }

        /* Dark theme adjustments */
        [data-theme="dark"] .essay-header:not(.has-image) {
            background: rgba(255, 255, 255, 0.05);
        }

        [data-theme="dark"] .essay-image {
            border-color: rgba(255, 255, 255, 0.1);
        }

        [data-theme="dark"] .essay-content {
            background: transparent;
        }

        .essay-header h1 {
            font-size: 2.5rem;
            font-weight: 200;
            margin-bottom: 1.5rem;
            color: var(--text-color);
            line-height: 1.2;
            letter-spacing: 0.5px;
        }

        .essay-meta {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .essay-author {
            color: var(--secondary-text);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .essay-author::before {
            content: '\f007';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 0.7rem;
        }



        .essay-date {
            color: var(--secondary-text);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .essay-date::before {
            content: '\f073';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 0.7rem;
        }

        .essay-content {
            line-height: 1.8;
            color: var(--text-color);
            background: var(--thought-bg);
            padding: 2rem 0;
        }

        .essay-content h1 {
            font-size: 2rem;
            font-weight: 300;
            margin: 2.5rem 0 1.5rem;
            color: var(--text-color);
            position: relative;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .essay-content h2 {
            font-size: 1.6rem;
            font-weight: 400;
            margin: 2rem 0 1rem;
            color: var(--text-color);
        }

        .essay-content h3 {
            font-size: 1.3rem;
            font-weight: 500;
            margin: 1.5rem 0 1rem;
            color: var(--text-color);
        }

        .essay-content h4 {
            font-size: 1.1rem;
            font-weight: 500;
            margin: 1.2rem 0 0.8rem;
            color: var(--text-color);
        }

        .essay-content p {
            margin: 1.2rem 0;
            text-align: justify;
        }

        .essay-content ul, 
        .essay-content ol {
            margin: 1.2rem 0;
            padding-left: 2rem;
        }

        .essay-content li {
            margin: 0.6rem 0;
        }

        .essay-content blockquote {
            border-left: 2px solid var(--text-color);
            margin: 2rem 0;
            padding: 1rem 1.5rem;
            background: var(--hover-bg);
            color: var(--secondary-text);
            font-style: italic;
        }

        .essay-content code {
            background: var(--code-bg);
            padding: 0.2rem 0.4rem;
            border-radius: 2px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.9em;
            border: 1px solid var(--border-color);
        }

        .essay-content pre {
            background: var(--code-bg);
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            margin: 1.5rem 0;
            border: 1px solid var(--border-color);
        }

        .essay-content .katex-display {
            margin: 1.75rem 0;
            padding: 0.5rem 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .essay-content .katex {
            color: var(--text-color);
            font-size: 1.05em;
        }

        .essay-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 2.5rem auto;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
            cursor: zoom-in;
        }

        .essay-content img:hover {
            transform: scale(1.02);
        }

        /* Image zoom modal styles */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .image-modal.active {
            display: flex;
        }

        .image-modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-modal-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            animation: zoomIn 0.3s ease;
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s ease;
            z-index: 2001;
        }

        .image-modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .image-modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s ease;
            z-index: 2001;
        }

        .image-modal-nav:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .image-modal-prev {
            left: 20px;
        }

        .image-modal-next {
            right: 20px;
        }

        .image-modal-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 2001;
        }

        @media (max-width: 768px) {
            .essay-content img {
                cursor: zoom-in;
                touch-action: manipulation;
            }

            .essay-content img:hover {
                transform: none;
            }

            .image-modal {
                padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
                touch-action: pan-y;
            }

            .image-modal-content {
                width: 100vw;
                height: 100dvh;
                max-width: 100vw;
                max-height: 100dvh;
                padding: 4rem 0 4.5rem;
            }

            .image-modal-img {
                max-width: 100vw;
                max-height: calc(100dvh - 8.5rem);
                border-radius: 0;
            }

            .image-modal-close {
                position: fixed;
                top: max(12px, env(safe-area-inset-top));
                right: 12px;
                width: 48px;
                height: 48px;
                font-size: 2.2rem;
                background: rgba(0, 0, 0, 0.35);
            }

            .image-modal-nav {
                width: 44px;
                height: 56px;
                padding: 0;
            }

            .image-modal-prev {
                left: 6px;
            }

            .image-modal-next {
                right: 6px;
            }

            .image-modal-counter {
                bottom: max(14px, env(safe-area-inset-bottom));
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .essay-content strong {
            color: var(--text-color);
            font-weight: 600;
        }

        .essay-content em {
            color: var(--secondary-text);
        }

        /* Table styles */
        .essay-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
        }

        .essay-content th,
        .essay-content td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .essay-content th {
            background: var(--hover-bg);
            color: var(--text-color);
            font-weight: 500;
        }

        .essay-content tr:hover {
            background: var(--hover-bg);
        }

        /* Progress indicator */
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background: var(--text-color);
            z-index: 1000;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .essay-header {
                padding: 3rem 1rem;
                margin-bottom: 2rem;
            }

            .essay-header h1 {
                font-size: 2rem;
            }
            
            .essay-meta {
                gap: 1rem;
                flex-direction: column;
                align-items: center;
            }

            .essay-author {
                font-size: 0.8rem;
            }
            
            .essay-detail {
                padding: 1rem;
            }

            .essay-content {
                padding: 2rem 1.5rem;
            }

            .essay-content h1 {
                font-size: 1.8rem;
            }

            .essay-content h2 {
                font-size: 1.5rem;
            }

            .back-link {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }

        }


    </style>
</head>
<body>
    <!-- Language Switcher -->
    <div class="language-switcher">
        <button onclick="setLanguage('zh')" id="lang-zh">中文</button>
        <button onclick="setLanguage('en')" id="lang-en">English</button>
    </div>

    <div class="top-links">
        <div class="menu-group">
            <a href="index.html">关于我</a>
            <a href="thoughts.html">想法</a>
            <a href="books.html">阅读</a>
            <a href="products.html">我的产品</a>
            <a href="investment.html">投资</a>
        </div>
    </div>

    <!-- Reading progress bar -->
    <div class="reading-progress" id="reading-progress"></div>

    <main>
        <div class="essay-detail">
            <a href="index.html#articles" class="back-link">
                <i class="fas fa-arrow-left"></i>
                <span>返回文章列表</span>
            </a>
            
            <div class="essay-header">
                <h1 id="essay-title">文章标题</h1>
                <div class="essay-meta">
                    <div class="essay-author" id="essay-author">岳铭</div>
                    <div class="essay-date">
                        <span id="essay-date">2025-01-01</span>
                    </div>
                </div>
            </div>
            
            <div class="essay-content" id="essay-content">
                <!-- Content will be loaded dynamically -->
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 岳铭. All rights reserved.</p>
    </footer>

    <!-- Image zoom modal -->
    <div class="image-modal" id="imageModal">
        <div class="image-modal-content">
            <button class="image-modal-close" id="closeModal">&times;</button>
            <button class="image-modal-nav image-modal-prev" id="prevImage" style="display: none;">&#10094;</button>
            <img class="image-modal-img" id="modalImage" src="" alt="">
            <button class="image-modal-nav image-modal-next" id="nextImage" style="display: none;">&#10095;</button>
            <div class="image-modal-counter" id="imageCounter" style="display: none;"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Set initial theme
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            // Update language switcher active state
            const currentLang = getCurrentLanguage();
            const zhBtn = document.getElementById('lang-zh');
            const enBtn = document.getElementById('lang-en');
            if (zhBtn && enBtn) {
                zhBtn.classList.toggle('active', currentLang === 'zh');
                enBtn.classList.toggle('active', currentLang === 'en');
            }

            // Get essay ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const essayId = urlParams.get('id');

            // essay data (same as in essay.html)
            const essayData = {

                'popmart2': {
                    title: '泡泡玛特中报之后：爆款交接、海外降温与长期逻辑',
                    titleEn: 'After Pop Mart’s Interim Report: New Hits, Overseas Cooling, and the Long-Term Thesis',
                    author: '岳铭',
                    authorEn: 'Yue Ming',
                    date: '2026-08-21',
                    image: 'images/research/pop2cover.jpg',
                    file: 'essay/popmart2.md'
                },
                'sp500': {
                    title: '为什么投资标普500',
                    titleEn: 'Why I Invest in the S&P 500',
                    author: '岳铭',
                    authorEn: 'Yue Ming',
                    date: '2026-08-17',
                    image: 'images/research/sp500.png',
                    file: 'essay/sp500.md'
                },
                'invest_speculate': {
                    title: '投资和投机',
                    titleEn: 'Investment and speculation',
                    author: '岳铭',
                    authorEn: 'Yue Ming',
                    date: '2026-08-09',
                    image: 'images/research/invest_speculate.jpg',
                    file: 'essay/invest_speculate.md'
                },
                
                'popmart': {
                    title: '泡泡玛特凭什么',
                    titleEn: 'Why Pop Mart',
                    author: '岳铭',
                    authorEn: 'Yue Ming',
                    date: '2026-05-20',
                    image: 'images/research/pop.jpg',
                    file: 'essay/popmart.md'
                },
                'pangdonglai': {
                    title: '我对胖东来的理解',
                    titleEn: 'My Understanding of Pangdonglai',
                    author: '岳铭',
                    authorEn: 'Yue Ming',
                    date: '2026-04-12',
                    image: 'images/research/dl.jpeg',
                    file: 'essay/dl.md'
                },

                'how_to_learn_programming': {
                    title: '如何学会编程',
                    titleEn: 'How to Learn Programming',
                    author: '岳铭',
                    authorEn: 'Yue Ming',
                    date: '2024-12-24',
                    image: 'images/research/programming.jpg',
                    file: 'essay/how_to_learn_programming.md'
                }
            };

            if (essayId && essayData[essayId]) {
                const essay = essayData[essayId];
                
                // Update page content
                function updateContent() {
                    const currentLang = getCurrentLanguage();
                    const title = currentLang === 'zh' ? essay.title : essay.titleEn;
                    const author = currentLang === 'zh' ? essay.author : essay.authorEn;
                    
                    document.getElementById('essay-title').textContent = title;
                    document.getElementById('essay-author').textContent = author;
                    document.getElementById('essay-date').textContent = essay.date;
                    document.title = title;

                    // Set background image if available
                    const headerElement = document.querySelector('.essay-header');
                    if (essay.image) {
                        // Test if image loads successfully
                        const img = new Image();
                        img.onload = function() {
                            headerElement.style.backgroundImage = `url(${essay.image})`;
                            headerElement.classList.add('has-image');
                        };
                        img.onerror = function() {
                            // Image failed to load, use default styling
                            headerElement.classList.remove('has-image');
                        };
                        img.src = essay.image;
                    }
                    
                    // Update back link text
                    const backLinkSpan = document.querySelector('.back-link span');
                    if (backLinkSpan) {
                        backLinkSpan.textContent = currentLang === 'zh' ? '返回文章列表' : 'Back to Essays';
                    }
                }

                // Reading progress indicator
                function updateReadingProgress() {
                    const content = document.getElementById('essay-content');
                    const progressBar = document.getElementById('reading-progress');
                    
                    if (content && progressBar) {
                        const contentTop = content.offsetTop;
                        const contentHeight = content.offsetHeight;
                        const windowHeight = window.innerHeight;
                        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                        
                        const progress = Math.min(100, Math.max(0, 
                            ((scrollTop - contentTop + windowHeight) / contentHeight) * 100
                        ));
                        
                        progressBar.style.width = progress + '%';
                    }
                }

                // Add scroll listener for reading progress
                window.addEventListener('scroll', updateReadingProgress);
                window.addEventListener('resize', updateReadingProgress);
                
                updateContent();
                
                // Load markdown content
                try {
                    const response = await fetch(essay.file);
                    if (response.ok) {
                        const markdown = await response.text();
                        const mathExpressions = [];
                        const protectedMarkdown = markdown.replace(
                            /\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)/g,
                            expression => {
                                const index = mathExpressions.push(expression) - 1;
                                return `KATEXMATHPLACEHOLDER${index}END`;
                            }
                        );
                        let html = marked.parse(protectedMarkdown);
                        html = html.replace(/KATEXMATHPLACEHOLDER(\d+)END/g, (_, index) =>
                            mathExpressions[Number(index)]
                                .replace(/&/g, '&amp;')
                                .replace(/</g, '&lt;')
                                .replace(/>/g, '&gt;')
                        );
                        const essayContent = document.getElementById('essay-content');
                        essayContent.innerHTML = html;

                        if (typeof renderMathInElement === 'function') {
                            renderMathInElement(essayContent, {
                                delimiters: [
                                    { left: '$$', right: '$$', display: true },
                                    { left: '\\[', right: '\\]', display: true },
                                    { left: '\\(', right: '\\)', display: false }
                                ],
                                throwOnError: false
                            });
                        }
                        initializeImageZoom();
                        
                    } else {
                        // Fallback content if file doesn't exist
                        const currentLang = getCurrentLanguage();
                        const fallbackContent = currentLang === 'zh' 
                            ? '<p>文章内容正在整理中，敬请期待...</p>'
                            : '<p>Essay content is being organized, please stay tuned...</p>';
                        document.getElementById('essay-content').innerHTML = fallbackContent;
                    }
                } catch (error) {
                    console.error('Error loading essay content:', error);
                    const currentLang = getCurrentLanguage();
                    const errorContent = currentLang === 'zh' 
                        ? '<p>加载文章内容时出错，请稍后再试。</p>'
                        : '<p>Error loading essay content, please try again later.</p>';
                    document.getElementById('essay-content').innerHTML = errorContent;
                }
                
                // Update content when language changes
                const originalSetLanguage = window.setLanguage;
                window.setLanguage = function(lang) {
                    originalSetLanguage(lang);
                    updateContent();
                };
                
            } else {
                // essay not found
                const currentLang = getCurrentLanguage();
                const notFoundContent = currentLang === 'zh' 
                    ? '<h1>文章未找到</h1><p>抱歉，您访问的文章内容不存在。</p>'
                    : '<h1>Essay Not Found</h1><p>Sorry, the essay content you are looking for does not exist.</p>';
                document.querySelector('.essay-detail').innerHTML = notFoundContent;
            }

            // Update page content based on current language
            updatePageContent();
        });

        // Image zoom functionality
        let currentImageIndex = 0;
        let allImages = [];
        let imageZoomInitialized = false;

        function initializeImageZoom() {
            const contentImages = document.querySelectorAll('.essay-content img');
            allImages = Array.from(contentImages);

            if (imageZoomInitialized || allImages.length === 0) return;
            imageZoomInitialized = true;
            
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const closeBtn = document.getElementById('closeModal');
            const prevBtn = document.getElementById('prevImage');
            const nextBtn = document.getElementById('nextImage');
            const counter = document.getElementById('imageCounter');

            // Add click event to all images
            allImages.forEach((img, index) => {
                img.addEventListener('click', function(e) {
                    e.stopPropagation();
                    currentImageIndex = index;
                    openImageModal(img.src);
                });
            });

            // Close modal
            closeBtn.addEventListener('click', closeImageModal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeImageModal();
                }
            });

            // Navigation
            prevBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                currentImageIndex = (currentImageIndex - 1 + allImages.length) % allImages.length;
                openImageModal(allImages[currentImageIndex].src);
            });

            nextBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                currentImageIndex = (currentImageIndex + 1) % allImages.length;
                openImageModal(allImages[currentImageIndex].src);
            });

            // Swipe left or right to navigate on touch devices
            let touchStartX = 0;
            modal.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].clientX;
            }, { passive: true });

            modal.addEventListener('touchend', function(e) {
                if (!modal.classList.contains('active') || allImages.length < 2) return;
                const distance = e.changedTouches[0].clientX - touchStartX;
                if (Math.abs(distance) < 50) return;

                currentImageIndex = distance > 0
                    ? (currentImageIndex - 1 + allImages.length) % allImages.length
                    : (currentImageIndex + 1) % allImages.length;
                openImageModal(allImages[currentImageIndex].src);
            }, { passive: true });

            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (!modal.classList.contains('active')) return;
                
                if (e.key === 'Escape') {
                    closeImageModal();
                } else if (e.key === 'ArrowLeft') {
                    currentImageIndex = (currentImageIndex - 1 + allImages.length) % allImages.length;
                    openImageModal(allImages[currentImageIndex].src);
                } else if (e.key === 'ArrowRight') {
                    currentImageIndex = (currentImageIndex + 1) % allImages.length;
                    openImageModal(allImages[currentImageIndex].src);
                }
            });

            function openImageModal(src) {
                modal.classList.add('active');
                modalImage.src = src;
                
                // Show/hide navigation buttons
                if (allImages.length > 1) {
                    prevBtn.style.display = 'block';
                    nextBtn.style.display = 'block';
                    counter.style.display = 'block';
                    counter.textContent = `${currentImageIndex + 1} / ${allImages.length}`;
                } else {
                    prevBtn.style.display = 'none';
                    nextBtn.style.display = 'none';
                    counter.style.display = 'none';
                }
                
                document.body.style.overflow = 'hidden';
            }

            function closeImageModal() {
                modal.classList.remove('active');
                modalImage.src = '';
                document.body.style.overflow = '';
            }
        }
    </script>
</body>
</html>
