    <style>
        .home-page main { max-width: 800px; padding: 88px 32px 48px; }
        .home-page .resume-header { margin: 0 0 64px; padding: 0; max-width: none; text-align: left; border: 0; }
        .home-page .resume-header h1 { margin: 30px 0 0; font-size: 1.55rem; font-weight: 400; text-align: left; }
        .avatar-nav { position: relative; display: flex; align-items: center; width: 100%; min-height: 88px; }
        .avatar-trigger { flex: 0 0 88px; width: 88px; height: 88px; border: 0; padding: 0; border-radius: 50%; overflow: hidden; cursor: pointer; background: var(--hover-bg); z-index: 1; }
        .avatar-trigger img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; transform: scale(3.0) translateY(-10%); }
        .home-page .top-links { position: static; width: auto; min-width: 0; right: auto; padding: 0; background: transparent; overflow: hidden; box-shadow: none; }
        .home-page .avatar-banner { position: absolute; left: 88px; right: 0; top: 50%; transform: translateY(-50%); opacity: 0; visibility: hidden; clip-path: inset(0 100% 0 0); pointer-events: none; transition: clip-path .35s ease, opacity .2s ease; }
        .avatar-nav.is-open .avatar-banner { opacity: 1; visibility: visible; clip-path: inset(0 0 0 0); pointer-events: auto; }
        .home-page .menu-group { margin: 0; min-width: 0; width: max-content; padding: 12px 0 12px 24px; gap: 18px; flex-wrap: wrap; justify-content: flex-start; font-size: .85rem; }
        .home-page .top-links .menu-group .menu-controls { position: static; margin: 0; padding: 0; background: transparent; }
        .home-page .top-links .menu-group button { position: static; margin: 0; }
        .home-articles { margin: 0; }
        .home-essay-list { display: flex; flex-direction: column; gap: 0; }
        .home-essay-link { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 24px; padding: 15px 0; align-items: baseline; text-decoration: none; color: var(--text-color); }
        .home-essay-date { color: var(--secondary-text); font-size: .88rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .home-essay-title { margin: 0; font-size: 1.05rem; font-weight: 400; line-height: 1.75; color: inherit; }
        .home-essay-link:hover { color: var(--link-color); text-decoration: none; }
        .home-essay-link:hover .home-essay-title { text-decoration: underline; text-underline-offset: 5px; }
        .home-page #connect { position: static; margin: 54px 0 0; padding: 0; }
        .home-page .social-links { justify-content: flex-start; gap: 20px; }
        .home-page .social-links a { width: 28px; height: 32px; padding: 0; background: transparent; border-radius: 0; font-size: 1.25rem; color: var(--secondary-text); }
        .home-page .social-links a:hover { color: var(--text-color); }
        .home-page .email-link, .home-page .email-link:hover { position: relative; text-decoration: none; }
        .home-page .email-link::before { content: ""; position: absolute; left: -8px; bottom: 100%; width: 44px; height: 10px; }
        .home-page .email-tooltip { position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translate(-50%, 4px); padding: 6px 9px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--bg-color); color: var(--text-color); font-size: .72rem; font-weight: 400; line-height: 1; white-space: nowrap; opacity: 0; visibility: hidden; pointer-events: none; user-select: text; cursor: text; transition: opacity .16s ease, transform .16s ease, visibility .16s ease; }
        .home-page .email-link:hover .email-tooltip, .home-page .email-link:focus-visible .email-tooltip { transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto; }
        .home-page footer { display: none; }
        .home-page a:focus-visible, .avatar-trigger:focus-visible { outline: 2px solid var(--secondary-text); outline-offset: 5px; }
        @media (max-width: 560px) {
            .home-page main { padding: 48px 24px 32px; }
            .home-page .resume-header { margin-bottom: 40px; }
            .avatar-trigger { flex-basis: 68px; width: 68px; height: 68px; }
            .avatar-nav { min-height: 112px; }
            .home-page .avatar-banner { left: 68px; }
            .home-page .menu-group { width: 100%; padding-left: 18px; gap: 12px; }
            .home-essay-link { grid-template-columns: 82px minmax(0, 1fr); gap: 16px; padding: 13px 0; }
            .home-essay-date { font-size: .75rem; }
            .home-essay-title { font-size: .95rem; }
        }
        @media (prefers-reduced-motion: reduce) { .home-page .avatar-banner { transition: none; } }
    </style>

    <script>
        // Set initial theme
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            // Update language switcher active state
            const currentLang = getCurrentLanguage();
            document.getElementById('lang-zh').classList.toggle('active', currentLang === 'zh');
            document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');

            const homeEssays = [
                {
                    id: 'token_efficiency',
                    title: '未来企业和个人的竞争力：token成本效益',
                    titleEn: 'Future Competitiveness: Token Cost Efficiency',
                    description: '在AI时代，token的成本效益将成为企业和个人竞争力的核心衡量指标。',
                    descriptionEn: 'In the AI era, token cost efficiency becomes a core metric for competitive advantage for both companies and individuals.',
                    date: '2026-09-20',
                    image: 'images/research/token_efficiency.png'
                },
                {
                    id: 'berkshire-after-buffett',
                    title: '后巴菲特时代的伯克希尔',
                    titleEn: 'Berkshire in the Post-Buffett Era',
                    description: '从现有业务、制度文化与管理层交接，理解后巴菲特时代的伯克希尔。',
                    descriptionEn: 'Understanding post-Buffett Berkshire through its businesses, institutional culture, and leadership transition.',
                    date: '2026-09-19',
                    image: 'images/research/buffett_berkshire.png'
                },
                {
                    id: 'popmart2',
                    title: '泡泡玛特中报之后：爆款交接、海外降温与长期逻辑',
                    titleEn: 'After Pop Mart’s Interim Report: New Hits, Overseas Cooling, and the Long-Term Thesis',
                    description: '从IP结构、海外业务、线下扩张和管理层表现重新审视泡泡玛特的长期逻辑。',
                    descriptionEn: 'A renewed look at Pop Mart’s long-term thesis through its IP mix, overseas business, offline expansion, and management.',
                    date: '2026-08-21',
                    image: 'images/research/pop2cover.jpg'
                },
                {
                    id: 'sp500',
                    title: '为什么投资标普500',
                    titleEn: 'Why I Invest in the S&P 500',
                    description: '我投资标普500的原因、买入策略与长期持有思路。',
                    descriptionEn: 'My reasons, buying strategy, and long-term approach to investing in the S&P 500.',
                    date: '2026-08-17',
                    image: 'images/research/sp500.png'
                },
                {
                    id: 'invest_speculate',
                    title: '投资和投机',
                    titleEn: 'Investment and Speculation',
                    description: '个人对投资和投机的理解。',
                    descriptionEn: 'My understanding of investment and speculation.',
                    date: '2026-08-09',
                    image: 'images/research/invest_speculate.jpg'
                },
                {
                    id: 'popmart',
                    title: '泡泡玛特凭什么',
                    titleEn: 'Why Pop Mart',
                    description: '泡泡玛特的商业模式、核心护城河以及未来发展的机会与风险。',
                    descriptionEn: 'Pop Mart’s business model, moat, opportunities, and risks.',
                    date: '2026-05-20',
                    image: 'images/research/pop.jpg'
                },
                {
                    id: 'pangdonglai',
                    title: '我对胖东来的理解',
                    titleEn: 'My Understanding of Pangdonglai',
                    description: '对于胖东来商超商业模式的分析。',
                    descriptionEn: 'An analysis of Pangdonglai’s supermarket business model.',
                    date: '2026-04-12',
                    image: 'images/research/dl.jpeg'
                },
                {
                    id: 'how_to_learn_programming',
                    title: '如何学会编程',
                    titleEn: 'How to Learn Programming',
                    description: '如何成为一个真正的 programmer。',
                    descriptionEn: 'How to become a real programmer.',
                    date: '2024-12-24',
                    image: 'images/research/programming.jpg'
                }
            ];

            function renderHomeEssays() {
                const isChinese = getCurrentLanguage() === 'zh';
                const trigger = document.getElementById('avatar-trigger');
                trigger.setAttribute('aria-label', isChinese ? '展开或收起菜单' : 'Toggle navigation');
                document.getElementById('home-essay-list').innerHTML = homeEssays.map(essay => `
                    <a class="home-essay-link" href="essay-detail.html?id=${essay.id}">
                        <time class="home-essay-date" datetime="${essay.date}">${essay.date}</time>
                        <h2 class="home-essay-title">${isChinese ? essay.title : essay.titleEn}</h2>
                    </a>
                `).join('');
            }

            const avatarNav = document.getElementById('avatar-nav');
            const avatarTrigger = document.getElementById('avatar-trigger');
            const avatarBanner = document.getElementById('avatar-banner');
            let menuCloseTimer;
            let menuHovered = false;
            function setMenuOpen(open) {
                clearTimeout(menuCloseTimer);
                avatarNav.classList.toggle('is-open', open);
                avatarTrigger.setAttribute('aria-expanded', String(open));
                avatarBanner.inert = !open;
            }
            avatarNav.addEventListener('pointerenter', event => {
                if (event.pointerType === 'mouse') {
                    menuHovered = true;
                    setMenuOpen(true);
                }
            });
            avatarNav.addEventListener('pointerleave', event => {
                if (event.pointerType === 'mouse') {
                    menuHovered = false;
                    menuCloseTimer = setTimeout(() => {
                        if (!menuHovered && !avatarNav.contains(document.activeElement)) setMenuOpen(false);
                    }, 180);
                }
            });
            avatarTrigger.addEventListener('click', () => setMenuOpen(!avatarNav.classList.contains('is-open')));
            avatarNav.addEventListener('focusout', event => {
                if (!menuHovered && !avatarNav.contains(event.relatedTarget)) setMenuOpen(false);
            });
            document.addEventListener('pointerdown', event => {
                if (!avatarNav.contains(event.target)) setMenuOpen(false);
            });
            avatarNav.addEventListener('keydown', event => {
                if (event.key === 'Escape') { avatarTrigger.focus(); setMenuOpen(false); }
            });

            renderHomeEssays();

            const originalSetLanguage = window.setLanguage;
            window.setLanguage = function(lang) {
                originalSetLanguage(lang);
                renderHomeEssays();
            };
        });
    </script>
