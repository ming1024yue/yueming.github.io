<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的产品</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="translations.js?v=20261009-5"></script>
    <style>
        .products-showcase {
            max-width: 880px;
            margin: 0 auto;
            padding: 3rem 1.25rem 5rem;
        }

        .products-showcase h2 {
            margin: 0 0 2.5rem;
            font-size: 1.65rem;
            font-weight: 500;
        }

        .product-matrix {
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .product-row {
            display: grid;
            grid-template-columns: 190px 1fr;
            min-height: 210px;
        }

        .product-row + .product-row {
            border-top: 1px solid var(--border-color);
        }

        .product-category {
            padding: 2.25rem 1.5rem 2.25rem 0;
            border-right: 1px solid var(--border-color);
        }

        .product-category h3 {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.5;
        }

        .product-apps {
            display: flex;
            align-items: flex-start;
            gap: 3.5rem;
            padding: 2.25rem 2.75rem;
        }

        .product-app {
            width: 112px;
            color: var(--text-color);
            text-align: center;
            text-decoration: none;
            transition: transform 160ms ease;
        }

        .product-app:hover,
        .product-app:focus-visible {
            transform: translateY(-4px);
        }

        .product-app:focus-visible {
            outline: 1px solid var(--secondary-text);
            outline-offset: 8px;
            border-radius: 12px;
        }

        .app-icon {
            display: block;
            width: 84px;
            height: 84px;
            margin: 0 auto 0.8rem;
            overflow: hidden;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-radius: 22%;
        }

        .app-icon img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-icon.deep-focus-icon img {
            width: 180%;
            height: 180%;
            max-width: none;
            transform: translate(-22%, -15%);
        }

        .product-name {
            display: block;
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .download-dialog {
            position: fixed;
            inset: 0;
            width: min(88vw, 380px);
            margin: auto;
            padding: 0;
            color: var(--text-color);
            background: var(--thought-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.16);
        }

        .download-dialog::backdrop {
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(2px);
        }

        .download-dialog-content {
            padding: 1.6rem;
        }

        .download-dialog h3 {
            margin: 0 0 0.65rem;
            font-size: 1rem;
            font-weight: 500;
        }

        .download-dialog p {
            margin: 0;
            color: var(--secondary-text);
            font-size: 0.88rem;
            line-height: 1.65;
        }

        .download-dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.65rem;
            margin-top: 1.5rem;
        }

        .download-dialog-actions button,
        .download-dialog-actions a {
            padding: 0.5rem 0.85rem;
            color: var(--text-color);
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font: inherit;
            font-size: 0.82rem;
            text-decoration: none;
            cursor: pointer;
        }

        .download-dialog-actions button:hover,
        .download-dialog-actions a:hover {
            background: var(--hover-bg);
        }

        @media (max-width: 700px) {
            .products-showcase {
                padding: 2rem 1rem 4rem;
            }

            .products-showcase h2 {
                margin-bottom: 2rem;
            }

            .product-row {
                display: block;
            }

            .product-category {
                padding: 1.4rem 0 1rem;
                border-right: 0;
            }

            .product-apps {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 2rem 1rem;
                padding: 1rem 0 1.8rem;
            }

            .product-app {
                width: 100%;
            }

            .app-icon {
                width: 78px;
                height: 78px;
            }
        }
    </style>
</head>
<body>
    <!-- Language Switcher -->
    <div class="language-switcher">
        <button onclick="setLanguage('zh')" id="lang-zh">中文</button>
        <button onclick="setLanguage('en')" id="lang-en">English</button>
    </div>

    <div class="top-links">
        <div class="menu-group">
            <a href="index.html">关于我</a>
            <a href="thoughts.html">想法</a>
            <a href="books.html">阅读</a>
            <a href="products.html">我的产品</a>
        </div>
    </div>
    <main>
        <section class="products-showcase">
            <h2 data-translate="products.title">我的产品</h2>
           
            <div class="product-matrix">
                <section class="product-row">
                    <div class="product-category">
                        <h3>
                            <span data-translate="products.category.selfimprovement">自我提升</span>
                        </h3>
                    </div>
                    <div class="product-apps">
                        <a class="product-app" data-product="deepfocus" href="https://apps.apple.com/cn/app/id6748027168" target="_blank" rel="noopener noreferrer">
                            <span class="app-icon deep-focus-icon">
                                <img src="images/product/deep_focus.webp" alt="Deep Focus 应用图标" width="84" height="84" decoding="async">
                            </span>
                            <span class="product-name" data-translate="products.deepfocus.title">Deep Focus 深度聚焦</span>
                        </a>

                        <a class="product-app" data-product="roam" href="https://apps.apple.com/app/id6820401673" target="_blank" rel="noopener noreferrer">
                            <span class="app-icon">
                                <img src="images/product/roam.webp" alt="漫步星球应用图标" width="84" height="84" decoding="async">
                            </span>
                            <span class="product-name" data-translate="products.roam.title">漫步星球 · ROAM</span>
                        </a>

                        <a class="product-app" data-product="selftaught" href="https://selftaught.fun/" target="_blank" rel="noopener noreferrer">
                            <span class="app-icon">
                                <img src="images/product/selftaught.svg" alt="自学坊网站图标" width="84" height="84" decoding="async">
                            </span>
                            <span class="product-name" data-translate="products.selftaught.title">自学坊</span>
                        </a>
                    </div>
                </section>

                <section class="product-row">
                    <div class="product-category">
                        <h3>
                            <span data-translate="products.category.tools">工具</span>
                        </h3>
                    </div>
                    <div class="product-apps">
                        <a class="product-app" data-product="allwrite" href="https://apps.apple.com/cn/app/all-write/id6760831427?mt=12" target="_blank" rel="noopener noreferrer">
                            <span class="app-icon">
                                <img src="images/product/all_write.webp" alt="All Write 应用图标" width="84" height="84" decoding="async">
                            </span>
                            <span class="product-name" data-translate="products.allwrite.title">All Write 写作</span>
                        </a>

                        <a class="product-app" id="google-translate-download-trigger" data-product="googletranslate" href="https://github.com/ming1024yue/google-translate-menu/releases/download/v0.1.0/GoogleTranslateMenu-0.1.0-arm64.dmg">
                            <span class="app-icon">
                                <img src="images/product/google-translate-menu.webp" alt="Google Translate Menu 应用图标" width="84" height="84" decoding="async">
                            </span>
                            <span class="product-name" data-translate="products.googletranslate.title">Google Translate Menu</span>
                        </a>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <dialog class="download-dialog" id="google-translate-download-dialog">
        <div class="download-dialog-content">
            <h3 data-translate="products.googletranslate.dialog.title">下载 Google Translate Menu？</h3>
            <p data-translate="products.googletranslate.dialog.message">即将下载适用于 Apple 芯片 Mac 的安装包，是否继续？</p>
            <div class="download-dialog-actions">
                <button type="button" id="cancel-google-translate-download" data-translate="products.googletranslate.dialog.cancel">取消</button>
                <a href="https://github.com/ming1024yue/google-translate-menu/releases/download/v0.1.0/GoogleTranslateMenu-0.1.0-arm64.dmg" id="confirm-google-translate-download" data-translate="products.googletranslate.dialog.confirm">确认下载</a>
            </div>
        </div>
    </dialog>

    <footer>
        <p>&copy; 2026 岳铭. All rights reserved.</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const trigger = document.getElementById('google-translate-download-trigger');
            const dialog = document.getElementById('google-translate-download-dialog');
            const cancelButton = document.getElementById('cancel-google-translate-download');

            trigger?.addEventListener('click', event => {
                event.preventDefault();
                dialog?.showModal();
            });

            cancelButton?.addEventListener('click', () => dialog?.close());

            dialog?.addEventListener('click', event => {
                if (event.target === dialog) dialog.close();
            });
        });
    </script>
</body>
</html>
